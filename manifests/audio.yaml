    prompt: "Single sneaker footstep on hollow metal grating, short attack, faint metallic ring, close mic, no other sounds."
    seconds: 0.5
    variants: 4
    seed: 101
    estCostUsd: 0.02
  - id: sfx/jump
    kind: sfx
