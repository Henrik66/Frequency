# Audio generation manifest for tools/gen-audio.ts.
# Schema: see manifests/README.md.
#
# All music shares D minor and a 90 BPM grid (Riot at double time) so station
# loops stay blendable; 85 s is 32 bars at 90 BPM, the shared loop length.
# Prompts embed the station style guide from docs/PRD.md.
#
# Voices are designed from text descriptions (no cloned voices). Fill in the
# provider voice ids after creating them; --dry-run does not need them.

version: 1

voices:
  nightjar: ""       # warm, funny, a little evasive late-night DJ
  newsreader: ""     # calm weather/news bulletin reader
  velvet-ident: ""   # smoky jazz-radio ident voice
  riot-ident: ""     # shouty punk ident voice
  caller-01: ""      # lost-tape caller, decades-old recording feel

entries:
  # ---- Station music loops (music_v1 for drafts; bump model for finals) ----
  - id: music/velvet-loop
    kind: music
    model: music_v1
    out: assets-raw/audio/music/velvet-loop.mp3
    prompt: "Seamless instrumental loop, 90 BPM, D minor. Late-night jazz radio: brushed drums, upright bass, muted trumpet, warm amber noir mood, hazy and intimate, rain on a window."
    seconds: 85
    variants: 2
    seed: 883
    estCostUsd: 0.3
  - id: music/riot-loop
    kind: music
    model: music_v1
    out: assets-raw/audio/music/riot-loop.mp3
    prompt: "Seamless instrumental loop, 180 BPM double-time on a 90 BPM grid, D minor. Raw punk band: distorted guitars, pounding drums, shouted energy with no vocals, photocopy-grain aggression, short and sharp."
    seconds: 85
    variants: 2
    seed: 937
    estCostUsd: 0.3
  - id: music/forecast-loop
    kind: music
    model: music_v1
    out: assets-raw/audio/music/forecast-loop.mp3
    prompt: "Seamless instrumental loop, 90 BPM, D minor. Calm synth pad under a news-broadcast mood: soft pulses, gentle weather-map arpeggios, overcast blue-gray atmosphere, steady and reassuring."
    seconds: 85
    variants: 2
    seed: 991
    estCostUsd: 0.3
  - id: music/rewind-loop
    kind: music
    model: music_v1
    out: assets-raw/audio/music/rewind-loop.mp3
    prompt: "Seamless instrumental loop, 90 BPM, D minor. Dreamlike tape-reversed textures: backwards swells, warped piano, VHS wobble, melancholy and uncanny, as if a jazz record is playing in reverse."
    seconds: 85
    variants: 2
    seed: 1045
    estCostUsd: 0.3
  - id: music/title
    kind: music
    model: music_v1
    out: assets-raw/audio/music/title.mp3
    prompt: "Instrumental title theme, 90 BPM, D minor. A lone radio tower at 3 am: sparse piano over soft static swells, brushed drums entering halfway, hopeful and nocturnal."
    seconds: 45
    variants: 2
    seed: 7001
    estCostUsd: 0.3
  - id: music/finale
    kind: music
    model: music_v1
    out: assets-raw/audio/music/finale.mp3
    prompt: "Instrumental broadcast sign-off, 90 BPM, D minor. All stations at once resolving into one warm broadcast: strings, brushed drums, a rising final transmission that ends on open static."
    seconds: 60
    variants: 2
    seed: 7002
    estCostUsd: 0.3
  - id: music/credits
    kind: music
    model: music_v1
    out: assets-raw/audio/music/credits.mp3
    prompt: "Gentle instrumental credits piece, 90 BPM, D minor. Music-box piano over tape hiss, late-night and grateful, fades like a radio being switched off."
    seconds: 60
    variants: 2
    seed: 7003
    estCostUsd: 0.3

  # ---- SFX ----
  - id: sfx/footstep-concrete
    kind: sfx
    model: eleven_text_to_sound_v2
    out: assets-raw/audio/sfx/footstep-concrete.mp3
    prompt: "Single soft sneaker footstep on bare concrete, short attack, small room tail, close mic, no other sounds."
    seconds: 0.5
    variants: 4
    seed: 100
    estCostUsd: 0.02
