<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frequency</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0b0f; }
      #game { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        color: #e8e2d6; font: 600 20px/1.2 system-ui, sans-serif; letter-spacing: 0.2em;
        transition: opacity 400ms ease;
      }
      #boot.hidden { opacity: 0; pointer-events: none; }
      #hud { position: fixed; inset: 0; pointer-events: none; color: #e8e2d6; font: 500 14px/1.4 system-ui, sans-serif; }
      .hud-top { position: absolute; left: 24px; top: 20px; right: 24px; }
      .hud-title { font-weight: 700; letter-spacing: 0.08em; }
      .hud-hint { opacity: 0.7; margin-top: 4px; max-width: 60ch; }
      .hud-flash {
        position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%);
        font: 700 28px/1 system-ui, sans-serif; letter-spacing: 0.2em; opacity: 0; transition: opacity 200ms;
      }
      .hud-flash.on { opacity: 1; }
      .radio {
        position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%);
        width: min(640px, calc(100% - 32px)); padding: 12px 16px 10px;
        background: rgba(10, 10, 14, 0.72); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 10px;
      }
      .readout { display: flex; gap: 16px; align-items: baseline; font-family: ui-monospace, monospace; }
      .freq { font-size: 20px; font-weight: 700; min-width: 9ch; }
      .phys { margin-left: auto; opacity: 0.7; }
      .band { position: relative; height: 34px; margin-top: 8px; border-top: 1px solid rgba(255,255,255,0.25); }
      .marker { position: absolute; top: 0; height: 10px; border-left: 2px solid var(--c); }
      .marker span { position: absolute; top: 12px; left: 0; transform: translateX(-50%); font-size: 11px; color: var(--c); }
      .needle { position: absolute; top: -8px; width: 2px; height: 20px; background: #fff; transform: translateX(-1px); box-shadow: 0 0 8px #fff; }
      .keys { font-size: 11px; opacity: 0.55; margin-top: 2px; text-align: center; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="boot">FREQUENCY</div>
    <div id="hud"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
